<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YMT - Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Righteous&display=swap">
  <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>
  <header class="site-header">
    <div class="logo">Your Movie Tracker</div>
  </header>

  <main class="page">
    <section id="view-home" class="view">
      <h1 class="page-heading">Populärt just nu</h1>
      <p id="status-message" class="status-message" role="status" hidden></p>
      <ul id="title-list"></ul>
    </section>

    <section id="view-details" class="view hidden">
      <button id="back-button" class="back-button">‹ Back</button>
      <div class="details-layout">
        <img id="title-image" alt="Title Image">
        <div class="details-info">
          <h2 id="title-name"></h2>
          <p id="title-description"></p>
        </div>
      </div>
      <ul id="title-genres" class="genre-list"></ul>
    </section>
  </main>

  <script src="../Script/config.js"></script>
  <script src="../Script/app.js"></script>
</body>

</html>
